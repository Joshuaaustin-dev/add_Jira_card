<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebNX Intake Portal</title>
    <style>
        :root {
            color-scheme: light;
            --page-bg: #f4f6fa;
            --surface: #fff;
            --text: #172b4d;
            --muted: #5e6c84;
            --border: #dfe3eb;
            --input-bg: #fff;
            --input-border: #cfd5df;
            --placeholder: #8993a4;
            --accent: #0052cc;
            --accent-hover: #0747a6;
            --accent-fg: #fff;
            --accent-soft: #f0f5ff;
            --accent-soft-hover: #deebff;
            --danger: #ae2e24;
            --danger-soft: #f4f5f7;
            --success: #006644;
            --warning: #974f0c;
            --focus: #4c9aff;
            --shadow: 0 8px 28px rgba(23, 43, 77, 0.08);
        }

        body[data-theme="dark"] {
            color-scheme: dark;
            --page-bg: #111827;
            --surface: #1f2937;
            --text: #e5e7eb;
            --muted: #a8b3c5;
            --border: #3b4758;
            --input-bg: #111827;
            --input-border: #4b5563;
            --placeholder: #9ca3af;
            --accent: #8ab4ff;
            --accent-hover: #b0ccff;
            --accent-fg: #111827;
            --accent-soft: #25344d;
            --accent-soft-hover: #314563;
            --danger: #fca5a5;
            --danger-soft: #3b252b;
            --success: #86efac;
            --warning: #fbbf24;
            --focus: #93c5fd;
            --shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 48px 20px;
            background: var(--page-bg);
            color: var(--text);
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 920px;
            padding: 28px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .eyebrow {
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
        }

        h1 {
            margin: 8px 0 6px;
            font-size: 25px;
            line-height: 1.25;
        }

        .intro {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .theme-toggle,
        .reset-title {
            min-height: 32px;
            padding: 6px 10px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 12px;
        }

        .theme-toggle:hover,
        .reset-title:hover { background: var(--accent-soft); }

        .card-title-group { margin-bottom: 14px; }

        .card-title-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 4px;
        }

        .card-title-input { min-height: 42px; font-size: 14px; }
        .title-hint { margin: 5px 0 0; color: var(--muted); font-size: 11px; }

        .items-list {
            display: grid;
            gap: 8px;
        }

        .item-card {
            min-width: 0;
            margin: 0;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .item-heading-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 24px;
            margin-bottom: 4px;
        }

        .item-heading {
            font-size: 12px;
            font-weight: 700;
        }

        .remove-item {
            width: auto;
            min-height: 28px;
            margin: 0;
            padding: 3px 8px;
            border: 0;
            background: transparent;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
        }

        .remove-item:hover { background: var(--danger-soft); color: var(--danger); }
        .remove-item[hidden] { display: none; }

        .item-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .optional {
            color: var(--muted);
            font-size: 11px;
            font-weight: 400;
        }

        input {
            width: 100%;
            min-height: 38px;
            padding: 8px 10px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            background: var(--input-bg);
            color: var(--text);
            font: inherit;
            font-size: 13px;
        }

        input::placeholder { color: var(--placeholder); }
        input:focus { outline: 2px solid var(--focus); outline-offset: 1px; border-color: var(--accent); }

        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 12px;
        }

        button {
            min-height: 40px;
            padding: 9px 14px;
            border: 0;
            border-radius: 6px;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
        button:disabled { cursor: not-allowed; opacity: 0.55; }

        .add-item {
            background: var(--accent-soft);
            color: var(--accent-hover);
        }

        .add-item:hover:not(:disabled) { background: var(--accent-soft-hover); }

        .submit-button {
            min-width: 150px;
            background: var(--accent);
            color: var(--accent-fg);
        }

        .submit-button:hover:not(:disabled) { background: var(--accent-hover); }

        .hint {
            margin: 9px 0 0;
            color: var(--muted);
            font-size: 11px;
        }

        #status {
            min-height: 22px;
            margin-top: 16px;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
        }

        .status-loading { color: var(--warning); }
        .status-success { color: var(--success); }
        .status-error { color: var(--danger); }

        .jira-link {
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
        }

        .jira-link:hover { text-decoration: underline; }

        @media (max-width: 540px) {
            body { padding: 20px 12px; }
            .card { padding: 24px 18px; }
            .page-header { gap: 8px; }
            .theme-toggle { flex-shrink: 0; }
            .item-card { padding: 16px 12px; }
            .item-grid { grid-template-columns: 1fr; gap: 12px; }
            .actions { align-items: stretch; flex-direction: column; }
            .actions button { width: 100%; }
        }
    </style>
</head>
<body>
    <main class="card">
        <header class="page-header">
            <div>
                <span class="eyebrow">JIRA INTAKE</span>
                <h1>Create a Jira card</h1>
                <p class="intro">Add up to five items to one card. Names are required; sheet links are optional.</p>
            </div>
            <button id="themeToggle" class="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
        </header>

        <form id="intakeForm">
            <div class="card-title-group">
                <div class="card-title-label-row">
                    <label for="cardTitle">Card title</label>
                    <button id="resetTitleBtn" class="reset-title" type="button" hidden>Use item names</button>
                </div>
                <input id="cardTitle" class="card-title-input" type="text" maxlength="255" required
                    placeholder="Enter item names below to suggest a title">
                <p class="title-hint">Suggested from item names. Edit it to choose a different Jira title.</p>
            </div>
            <div id="itemsList" class="items-list"></div>
            <div class="actions">
                <button id="addItemBtn" class="add-item" type="button">+ Add item <span id="itemCount">1/5</span></button>
                <button id="syncBtn" class="submit-button" type="submit">Create Jira card</button>
            </div>
            <p class="hint">Press Enter in Serial Sheet to add the next item. Use Ctrl/Command+Enter to create the card.</p>
            <div id="status" role="status" aria-live="polite"></div>
        </form>
    </main>

    <script>
        const MAX_ITEMS = 5;
        const intakeForm = document.getElementById('intakeForm');
        const itemsList = document.getElementById('itemsList');
        const addItemBtn = document.getElementById('addItemBtn');
        const itemCount = document.getElementById('itemCount');
        const syncBtn = document.getElementById('syncBtn');
        const statusDiv = document.getElementById('status');
        const cardTitle = document.getElementById('cardTitle');
        const resetTitleBtn = document.getElementById('resetTitleBtn');
        const themeToggle = document.getElementById('themeToggle');
        const THEME_STORAGE_KEY = 'webnx-intake-theme';
        let titleWasEdited = false;
        let nextItemId = 1;

        function applyTheme(theme, save = false) {
            document.body.dataset.theme = theme;
            themeToggle.setAttribute('aria-pressed', String(theme === 'dark'));
            themeToggle.textContent = theme === 'dark' ? 'Dark mode: On' : 'Dark mode: Off';
            if (save) {
                try {
                    localStorage.setItem(THEME_STORAGE_KEY, theme);
                } catch (error) {
                    console.error('Could not save the theme preference.', error);
                }
            }
        }

        let savedTheme;
        try {
            savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
        } catch (error) {
            console.error('Could not load the saved theme preference.', error);
        }
        applyTheme(savedTheme === 'dark' || savedTheme === 'light'
            ? savedTheme
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
        themeToggle.addEventListener('click', () => {
            applyTheme(document.body.dataset.theme === 'dark' ? 'light' : 'dark', true);
        });

        function createField(id, labelText, placeholder, type, required, fullWidth, optional = false) {
            const group = document.createElement('div');
            group.className = fullWidth ? 'form-group form-group--full' : 'form-group';

            const label = document.createElement('label');
            label.htmlFor = id;
            label.textContent = labelText;
            if (optional) {
                const note = document.createElement('span');
                note.className = 'optional';
                note.textContent = ' (optional)';
                label.append(note);
            }

            const input = document.createElement('input');
            input.id = id;
            input.name = id;
            input.type = type;
            input.placeholder = placeholder;
            input.required = required;
            if (type === 'text') input.maxLength = 255;
            if (type === 'url') input.maxLength = 2048;

            group.append(label, input);
            return { group, input };
        }

        function createItemCard() {
            const itemId = nextItemId++;
            const card = document.createElement('div');
            card.className = 'item-card';
            card.setAttribute('role', 'group');

            const headingRow = document.createElement('div');
            headingRow.className = 'item-heading-row';
            const heading = document.createElement('span');
            heading.className = 'item-heading';
            const removeBtn = document.createElement('button');
            removeBtn.className = 'remove-item';
            removeBtn.type = 'button';
            removeBtn.textContent = 'Remove';
            headingRow.append(heading, removeBtn);

            const grid = document.createElement('div');
            grid.className = 'item-grid';

            const name = createField(`item-name-${itemId}`, 'Item name', 'e.g. Build name', 'text', true, true);
            name.input.className = 'item-name';
            const build = createField(`build-sheet-${itemId}`, 'Build Sheet', 'https://...', 'url', false, false, true);
            const serial = createField(`serial-sheet-${itemId}`, 'Serial Sheet', 'https://...', 'url', false, false, true);

            grid.append(name.group, build.group, serial.group);
            card.append(headingRow, grid);
            return card;
        }

        function refreshItems() {
            const cards = [...itemsList.querySelectorAll('.item-card')];
            cards.forEach((card, index) => {
                card.setAttribute('aria-label', `Item ${index + 1}`);
                card.querySelector('.item-heading').textContent = `Item ${index + 1}`;
                const removeBtn = card.querySelector('.remove-item');
                removeBtn.hidden = cards.length === 1;
                removeBtn.setAttribute('aria-label', `Remove item ${index + 1}`);
            });
            itemCount.textContent = `${cards.length}/${MAX_ITEMS}`;
            addItemBtn.disabled = cards.length >= MAX_ITEMS;
        }

        function suggestedTitle() {
            return [...itemsList.querySelectorAll('.item-name')]
                .map(input => input.value.trim())
                .filter(Boolean)
                .join(' + ')
                .slice(0, 255);
        }

        function refreshTitle() {
            if (!titleWasEdited) cardTitle.value = suggestedTitle();
            resetTitleBtn.hidden = !titleWasEdited;
        }

        itemsList.append(createItemCard());
        refreshItems();
        refreshTitle();
        itemsList.querySelector('input').focus();

        function addItem() {
            if (itemsList.children.length >= MAX_ITEMS) return;
            const card = createItemCard();
            itemsList.append(card);
            refreshItems();
            refreshTitle();
            card.querySelector('input').focus();
        }

        addItemBtn.addEventListener('click', addItem);

        itemsList.addEventListener('keydown', event => {
            if (event.key !== 'Enter' || event.ctrlKey || event.metaKey
                || !(event.target instanceof HTMLInputElement)) return;

            event.preventDefault();
            const fields = [...event.target.closest('.item-card').querySelectorAll('input')];
            const fieldIndex = fields.indexOf(event.target);
            if (fieldIndex < fields.length - 1) {
                fields[fieldIndex + 1].focus();
            } else if (itemsList.children.length < MAX_ITEMS) {
                addItem();
            } else {
                syncBtn.focus();
            }
        });

        itemsList.addEventListener('click', event => {
            if (!(event.target instanceof Element)) return;
            const removeBtn = event.target.closest('.remove-item');
            if (!removeBtn || itemsList.children.length <= 1) return;
            removeBtn.closest('.item-card').remove();
            refreshItems();
            refreshTitle();
        });

        itemsList.addEventListener('input', event => {
            if (event.target instanceof HTMLInputElement && event.target.matches('.item-name')) {
                refreshTitle();
            }
        });

        cardTitle.addEventListener('input', () => {
            titleWasEdited = cardTitle.value !== suggestedTitle();
            resetTitleBtn.hidden = !titleWasEdited;
        });
        resetTitleBtn.addEventListener('click', () => {
            titleWasEdited = false;
            refreshTitle();
            cardTitle.focus();
        });

        intakeForm.addEventListener('keydown', event => {
            if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
                event.preventDefault();
                intakeForm.requestSubmit();
            }
        });

        intakeForm.addEventListener('submit', async event => {
            event.preventDefault();
            itemsList.querySelectorAll('.item-name').forEach(input => {
                input.setCustomValidity(input.value.trim() ? '' : 'Enter an item name.');
            });
            if (!intakeForm.reportValidity()) return;

            const items = [...itemsList.querySelectorAll('.item-card')].map(card => {
                const inputs = card.querySelectorAll('input');
                return {
                    name: inputs[0].value.trim(),
                    buildSheet: inputs[1].value.trim(),
                    serialSheet: inputs[2].value.trim()
                };
            });

            syncBtn.disabled = true;
            addItemBtn.disabled = true;
            cardTitle.disabled = true;
            itemsList.querySelectorAll('input, .remove-item').forEach(control => {
                control.disabled = true;
            });
            statusDiv.className = 'status-loading';
            statusDiv.textContent = 'Creating Jira card...';

            try {
                const response = await fetch('/api/create-ticket', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: cardTitle.value.trim(), items })
                });
                const result = await response.json();

                if (!response.ok || !result.success) {
                    statusDiv.className = 'status-error';
                    statusDiv.textContent = result.message
                        || (result.error ? JSON.stringify(result.error) : `Could not create the Jira card (${response.status}).`);
                    return;
                }

                statusDiv.className = 'status-success';
                statusDiv.textContent = 'Jira card created: ';
                const link = document.createElement('a');
                link.className = 'jira-link';
                link.href = result.url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = result.key;
                statusDiv.append(link);
            } catch (error) {
                statusDiv.className = 'status-error';
                statusDiv.textContent = 'Could not reach the server. Try again.';
            } finally {
                syncBtn.disabled = false;
                cardTitle.disabled = false;
                itemsList.querySelectorAll('input, .remove-item').forEach(control => {
                    control.disabled = false;
                });
                refreshItems();
            }
        });
    </script>
</body>
</html>
